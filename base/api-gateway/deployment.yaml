apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: production-retail
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        serviceAccountName: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: api-gateway
          image: ghcr.io/ayushquasar/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.istio-system:4318"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
          volumeMounts:
            - name: metrics-config
              mountPath: /app/config/application.yaml
              subPath: application.yaml
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 40
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 15
      volumes:
        - name: metrics-config
          configMap:
            name: metrics-config
