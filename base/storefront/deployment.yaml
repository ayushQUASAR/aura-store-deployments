apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: production-retail
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      serviceAccountName: storefront
      containers:
        - name: storefront
          image: ghcr.io/ayushquasar/storefront:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: API_GATEWAY_URL
              value: "http://api-gateway-service:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
