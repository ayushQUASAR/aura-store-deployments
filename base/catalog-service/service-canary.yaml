apiVersion: v1
kind: Service
metadata:
  name: catalog-stable
  namespace: production-retail
  labels:
    app: catalog-service
    version: stable
spec:
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: catalog-service
    version: stable
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-canary
  namespace: production-retail
  labels:
    app: catalog-service
    version: canary
spec:
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: catalog-service
    version: canary
