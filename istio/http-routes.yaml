apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-traffic-split
  namespace: production-retail
spec:
  parentRefs:
    - name: waypoint
      namespace: production-retail
      kind: Gateway
  hostnames:
    - "catalog-service.production-retail.svc.cluster.local"
  rules:
    - backendRefs:
        - name: catalog-stable
          port: 8082
          weight: 90
        - name: catalog-canary
          port: 8082
          weight: 10
---
